# Purpose: Kubernetes Service Manifest exposing the web application to public traffic.
# Team Members: Joshitha Keetha & Bhuvitha Tummala

apiVersion: v1
kind: Service
metadata:
  name: swe645-survey-service
spec:
  type: NodePort
  selector:
    app: swe645-survey
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080