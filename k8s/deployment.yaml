# Purpose: Kubernetes Deployment Manifest configured with 3 redundant pods 
# Team Members: Joshitha Keetha & Bhuvitha Tummala
# SWE-645

apiVersion: apps/v1
kind: Deployment
metadata:
  name: swe645-survey-app
  labels:
    app: swe645-survey
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swe645-survey
  template:
    metadata:
      labels:
        app: swe645-survey
    spec:
      containers:
      - name: survey-container
        image: jkeetha28/swe645-survey-app:latest
        ports:
        - containerPort: 80